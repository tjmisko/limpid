[workspace]
members = ["crates/limpid-core", "crates/limpid", "crates/limpid-host", "crates/limpid-view"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
pulldown-cmark = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# QuickJS (MathJax) runs under a 1 MiB script stack limit. Unoptimised C
# frames exhaust it on macOS, so build the engine optimised in dev and test too.
[profile.dev.package.rquickjs-sys]
opt-level = 3
