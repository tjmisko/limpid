# limpid — Hyprland window rules
#
# Canonical copy of the compositor rule. The only strings that must stay in
# sync with crates/limpid-host/src/main.rs are the app id
# (`io.quasioptimal.limpid`) and the `limpid-hook` title prefix.
#
# In a Hyprland Lua config use the equivalent:
#
#   hl.window_rule({
#       name = "limpid-hook-no-initial-focus",
#       match = { class = "^io[.]quasioptimal[.]limpid$", initial_title = "^limpid-hook" },
#       no_initial_focus = true,
#   })
#
# In a classic hyprland.conf, add:

windowrulev2 = noinitialfocus, class:^(io[.]quasioptimal[.]limpid)$, initialtitle:^(limpid-hook)

# Safety net if limpid ever runs under XWayland, where the class is WM_CLASS
# (the program name) rather than the Wayland app id.
windowrulev2 = noinitialfocus, class:^(limpid-host)$, initialtitle:^(limpid-hook), xwayland:1
