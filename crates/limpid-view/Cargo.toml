[package]
name = "limpid-view"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "limpid_view"
path = "src/lib.rs"

[[bin]]
name = "limpid-view"
path = "src/main.rs"

[dependencies]
cosmic-text = "0.12"
libc = "0.2"
fontdb = { version = "0.23", default-features = false, features = ["fs", "memmap"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
limpid-core = { path = "../limpid-core" }
png = "0.17"
resvg = { version = "0.45", default-features = false }
rmpv = "1.3.1"
serde_json.workspace = true
softbuffer = "0.4"
tiny-skia = "0.11"
usvg = { version = "0.45", default-features = false, features = ["text"] }
winit = "0.30"
